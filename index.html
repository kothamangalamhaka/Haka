<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <title>Haka Cloud</title>
    <link rel="manifest" href="manifest.json">
    <style>
        body { margin: 0; background: #000; color: white; font-family: sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; overflow: hidden; }
        .loader { border: 4px solid #f3f3f3; border-top: 4px solid #3498db; border-radius: 50%; width: 40px; height: 40px; animation: spin 1s linear infinite; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        .text { margin-top: 20px; font-size: 18px; letter-spacing: 2px; text-transform: uppercase; }
    </style>
    <script>
        // Clear Cache and Cookies logic
        if ('serviceWorker' in navigator) {
            caches.keys().then(names => { for (let name of names) caches.delete(name); });
        }
        setTimeout(() => { window.location.replace("achieving-excuse-placement-relations.trycloudflare.com"); }, 2000);
    </script>
</head>
<body>
    <div style="text-align: center;">
        <div class="loader"></div>
        <div class="text">Connecting to Haka Server...</div>
    </div>
</body>
</html>
