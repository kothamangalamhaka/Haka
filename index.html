<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Connecting to Haka ERP...</title>
    
    <meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate, max-age=0">
    <meta http-equiv="Cache-Control" content="post-check=0, pre-check=0">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    
    <style>
        body {
            background-color: #0f172a;
            color: #e2e8f0;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
        }
        .loader {
            border: 4px solid #334155;
            border-top: 4px solid #38bdf8;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin-bottom: 20px;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>

    <script>
        // Force clear local storage and session storage
        sessionStorage.clear();
        localStorage.clear();

        // Dynamically fetch the latest URL directly from GitHub raw file (Bypasses Pages Cache)
        async function fetchLatestUrl() {
            try {
                // Add a random timestamp to prevent GitHub API caching
                const timestamp = new Date().getTime();
                const response = await fetch(`https://raw.githubusercontent.com/kothamangalamhaka/Haka/main/index.html?t=${timestamp}`);
                const text = await response.text();
                
                // Extract the URL from the fetched text
                const urlMatch = text.match(/window\.location\.replace\(['"]([^'"]+)['"]\)/);
                
                if (urlMatch && urlMatch[1]) {
                    window.location.replace(urlMatch[1]);
                } else {
                    // Fallback to the hardcoded URL if extraction fails
                    fallbackRedirect();
                }
            } catch (error) {
                fallbackRedirect();
            }
        }

        function fallbackRedirect() {
            // THE SCRIPT WILL AUTOMATICALLY REPLACE THE URL BELOW
            window.location.replace('https://YOUR_NEW_TUNNEL_URL_HERE');
        }

        window.onload = function() {
            setTimeout(fetchLatestUrl, 500); // Small delay to let loading animation show
        };
    </script>
</head>
<body>
    <div class="loader"></div>
    <h3>Securely connecting to Haka ERP...</h3>
    <p style="font-size: 0.8em; color: #94a3b8;">Bypassing cache, please wait.</p>
</body>
</html>
