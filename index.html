<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="refresh" content="3; url=https://capabilities-office-magazine-tab.trycloudflare.com">
    <title>Haka Private Cloud</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background: #f0f2f5; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .card { background: white; padding: 30px; border-radius: 20px; box-shadow: 0 15px 35px rgba(0,0,0,0.1); text-align: center; width: 90%; max-width: 400px; border-top: 5px solid #005bc5; }
        .loader { border: 4px solid #f3f3f3; border-top: 4px solid #005bc5; border-radius: 50%; width: 50px; height: 50px; animation: spin 1s linear infinite; margin: 25px auto; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        h2 { color: #1d1d1f; margin-bottom: 10px; }
        p { color: #6e6e73; font-size: 14px; }
        .btn { display: inline-block; margin-top: 20px; padding: 10px 20px; background: #005bc5; color: white; text-decoration: none; border-radius: 8px; font-weight: 500; transition: 0.3s; }
        .btn:hover { background: #004494; }
    </style>
</head>
<body>
    <div class="card">
        <h2>Haka Cloud</h2>
        <div class="loader"></div>
        <p>Connecting to your secure local server...</p>
        <a href="https://capabilities-office-magazine-tab.trycloudflare.com" class="btn">Go to Nextcloud</a>
    </div>
</body>
</html>
