<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="refresh" content="5; url=https://length-sim-projectors-components.trycloudflare.com">
    <title>Haka Private Cloud</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background: #0b0e14; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; color: #ffffff; }
        .card { background: #161b22; padding: 40px; border-radius: 12px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); text-align: center; border: 1px solid #30363d; width: 320px; }
        .loader { border: 3px solid #21262d; border-top: 3px solid #58a6ff; border-radius: 50%; width: 40px; height: 40px; animation: spin 1s linear infinite; margin: 20px auto; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        h2 { font-weight: 500; color: #58a6ff; margin-bottom: 10px; text-transform: uppercase; letter-spacing: 2px; }
        p { color: #8b949e; font-size: 13px; margin-bottom: 25px; }
        .btn { display: inline-block; padding: 10px 25px; background: #238636; color: white; text-decoration: none; border-radius: 6px; font-weight: 600; font-size: 14px; transition: 0.2s; }
        .btn:hover { background: #2ea043; }
    </style>
</head>
<body>
    <div class="card">
        <h2>HAKA CLOUD</h2>
        <div class="loader"></div>
        <p>Connecting to secure local host...</p>
        <a href="https://length-sim-projectors-components.trycloudflare.com" class="btn">LAUNCH SERVER</a>
    </div>
</body>
</html>
