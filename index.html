<!DOCTYPE html>
<html lang="ml">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Connecting to Haka Server...</title>
    <style>
        body {
            background: #121212;
            color: white;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
        }
        .container {
            text-align: center;
        }
        .loader {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #3498db;
            border-radius: 50%;
            width: 50px;
            height: 50px;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        .status {
            font-size: 1.2rem;
            margin-bottom: 10px;
            letter-spacing: 1px;
        }
        .sub-text {
            color: #888;
            font-size: 0.9rem;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="loader"></div>
    <div class="status" id="status-text">Connecting to Server...</div>
    <div class="sub-text" id="sub-text">Please wait while we fetch the latest secure link.</div>
</div>

<script>
    async function connectToServer() {
        const statusText = document.getElementById('status-text');
        const subText = document.getElementById('sub-text');

        try {
            // GitHub-ൽ നിന്ന് ഏറ്റവും പുതിയ tunnel_url.json എടുക്കുന്നു
            const response = await fetch('https://raw.githubusercontent.com/kothamangalamhaka/Haka/main/tunnel_url.json');
            
            if (!response.ok) throw new Error('Could not fetch link');
            
            const data = await response.json();
            const serverUrl = data.url;

            if (serverUrl && serverUrl.startsWith('https://')) {
                statusText.innerText = "Connection Established!";
                statusText.style.color = "#4CAF50";
                subText.innerText = "Redirecting you to Haka File Server...";
                
                // 1.5 സെക്കൻഡിന് ശേഷം സെർവറിലേക്ക് മാറ്റുന്നു
                setTimeout(() => {
                    window.location.href = serverUrl;
                }, 1500);
            } else {
                throw new Error('Invalid URL');
            }

        } catch (error) {
            statusText.innerText = "Server Offline";
            statusText.style.color = "#FF5252";
            subText.innerText = "The server is currently down or updating. Please try again in 2 minutes.";
            console.error(error);
        }
    }

    // പേജ് ലോഡ് ആകുമ്പോൾ കണക്ഷൻ തുടങ്ങുക
    window.onload = connectToServer;
</script>

</body>
</html>
