<a id="server-link" href="#" class="btn">Open Server</a>

<script>
  async function updateServerLink() {
    try {
      // GitHub-ile tunnel_url.json file fetch cheyyunnu
      const response = await fetch('https://raw.githubusercontent.com/kothamangalamhaka/Haka/main/tunnel_url.json');
      const data = await response.json();
      
      if (data.url) {
        // Button-te link Cloudflare URL-ileeku mathunnu
        document.getElementById('server-link').href = data.url;
      }
    } catch (error) {
      console.error('Error fetching tunnel URL:', error);
    }
  }

  // Page load aakumbol update cheyyan
  updateServerLink();
</script>
